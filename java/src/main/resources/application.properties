# Non-web CLI application — no embedded server
spring.main.web-application-type=none
spring.main.banner-mode=off

# Suppress framework noise; keep our package visible
logging.level.root=WARN
logging.level.com.finops=INFO

# ── Amazon Bedrock (Converse API) ─────────────────────────────────────────────
# Credentials are read from the standard AWS chain (env vars / ~/.aws / IAM role).
spring.ai.bedrock.aws.region=us-east-1
spring.ai.bedrock.converse.chat.options.model=anthropic.claude-3-5-sonnet-20241022-v2:0
